<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Control Ganadero Pro</title>
<style>
:root {
  color-scheme:dark;
  font:100% system-ui,sans-serif;
  color:#f0f7eb;
  background:#101815;
  --panel:#1a2621;
  --line:#3b4d43;
  --green:#b8efcc;
  --muted:#b4c9bc;
  --gold:#ffd478;
}
*{box-sizing:border-box}
body{margin:0}
[hidden]{display:none!important}
header{position:sticky;top:0;z-index:1;background:#15221b;border-bottom:1px solid var(--line);padding:1rem max(1rem,calc((100vw - 72rem)/2));display:flex;align-items:center;justify-content:space-between;gap:1rem}
header strong{font-size:1.15rem}
main{max-width:74rem;margin:auto;padding:clamp(1rem,3vw,2rem)}
h1,h2,h3,p{margin-top:0}
h1{font-size:clamp(2rem,6vw,3.6rem);letter-spacing:-.055em;margin-bottom:.5rem}
h2{font-size:1.3rem}
.panel,article,dialog{background:var(--panel);border:1px solid var(--line);border-radius:1rem;padding:clamp(1rem,3vw,1.6rem)}
.login{max-width:29rem;margin:clamp(1rem,7vh,5rem) auto}
.layout{display:grid;grid-template-columns:minmax(18rem,1fr) minmax(0,1.55fr);gap:1rem;align-items:start}
form,fieldset{display:grid;gap:.85rem}
fieldset{padding:0;border:0;margin:0;min-width:0}
fieldset:disabled{opacity:.65}
label{display:grid;gap:.3rem;font-weight:600;font-size:.95rem}
input,select,textarea,button{font:inherit}
input,select,textarea{width:100%;min-width:0;border:1px solid #61776b;border-radius:.5rem;padding:.63rem;color:inherit;background:#121c17}
textarea{resize:vertical}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.75rem}
.full{grid-column:1/-1}
button,.jump{background:var(--green);color:#14271b;border:1px solid transparent;border-radius:.65rem;padding:.65rem 1rem;font-weight:750}
button{cursor:pointer}
button:disabled{opacity:.55;cursor:default}
.jump{text-decoration:none}
.secondary{background:#23342b;color:inherit;border-color:#61776b}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.toolbar,.intro{display:flex;justify-content:space-between;gap:.75rem;flex-wrap:wrap}
.toolbar{align-items:center;margin-bottom:.7rem}
.toolbar h2{margin:0}
.intro{align-items:end;margin-bottom:1.3rem}
.intro p{margin:0;overflow-wrap:anywhere}
.cards{display:grid;gap:.7rem}
.cards article{padding:1rem;overflow-wrap:anywhere}
.cards h3{margin:0 0 .4rem}
.cards article button{margin:.25rem .35rem .25rem 0}
.meta{color:var(--muted);font-size:.9rem}
.status{margin:0;overflow-wrap:anywhere}
.status:empty{display:none}
.error{color:#ffb1a6}
nav{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap;margin-top:.75rem}
dialog{width:min(92vw,50rem);max-height:90vh;color:inherit}
dialog::backdrop{background:#0d231ecc}
dialog img{display:block;max-width:100%;max-height:67vh;object-fit:contain;margin:auto}
.dashboard{display:grid;grid-template-columns:1.35fr 1fr 1fr;gap:.8rem;margin-bottom:1rem}
.metric{min-width:0;display:flex;flex-direction:column;gap:.6rem}
.metric h2,.metric p{margin:0}
.metric h2{font-size:.95rem;color:var(--muted)}
.metric strong{font-size:clamp(1.65rem,4vw,2.6rem);font-weight:760;line-height:1;letter-spacing:-.05em;overflow-wrap:anywhere}
.metric-main{background:linear-gradient(135deg,#254635,#1d3127);border-color:#4b705c}
.metric-main strong{font-size:clamp(3rem,7vw,5rem);color:#e6ffec}
.metric-deaths strong{color:var(--gold)}
.herd-bar{height:.48rem;border-radius:2rem;background:var(--gold);overflow:hidden}
.herd-bar span{display:block;width:0;height:100%;background:#9bdfb5}
#resumen-aviso{margin-bottom:1rem}
#registro{scroll-margin-top:6rem}
@media(max-width:760px){
  .layout{grid-template-columns:1fr}
  .dashboard{grid-template-columns:repeat(2,minmax(0,1fr))}
  .metric-main{grid-column:1/-1}
  .intro{align-items:start}
}
@media(max-width:370px){.fields{grid-template-columns:1fr}}
@media(max-width:350px){.dashboard{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <strong>Control Ganadero Pro</strong>
  <button hidden id="salir" class="secondary" type="button">Cerrar sesión</button>
</header>

<main>
  <p id="aviso" class="status error" role="alert"></p>

  <section id="acceso" class="panel login">
    <h1>Iniciar sesión</h1>
    <p>Ingresa con tu cuenta de socio.</p>
    <form id="login">
      <fieldset id="login-campos" disabled>
        <label>Correo electrónico
          <input name="correo" type="email" autocomplete="username" required>
        </label>
        <label>Contraseña
          <input name="clave" type="password" autocomplete="current-password" required>
        </label>
        <button>Entrar</button>
      </fieldset>
      <p id="login-estado" class="status" role="alert"></p>
    </form>
  </section>

  <section id="app" hidden>
    <div class="intro">
      <div>
        <h1>Mi ganado</h1>
        <p id="cuenta" class="meta"></p>
      </div>
      <a class="jump" href="#registro">Registrar animal</a>
    </div>

    <p id="resumen-aviso" class="status" role="status"></p>
    <section id="resumen" class="dashboard" aria-label="Resumen del ganado" hidden>
      <article class="panel metric metric-main">
        <h2>Ganado en pie</h2>
        <strong id="ganado-vivo"></strong>
        <div id="barra-ganado" class="herd-bar" aria-hidden="true">
          <span id="barra-vivos"></span>
        </div>
        <p id="ganado-total" class="meta"></p>
      </article>
      <article class="panel metric">
        <h2>Costo de compra</h2>
        <strong id="costo-total"></strong>
        <p class="meta">Total registrado en MXN</p>
      </article>
      <article class="panel metric metric-deaths">
        <h2>Mortalidad</h2>
        <strong id="mortalidad"></strong>
        <p id="ganado-fallecido" class="meta"></p>
      </article>
    </section>

    <div class="layout">
      <section id="registro" class="panel">
        <h2>Registrar animal</h2>
        <form id="alta">
          <fieldset id="alta-campos" class="fields" disabled>
            <label>Arete<input name="arete" maxlength="80" required></label>
            <label>Nombre<input name="nombre" maxlength="120"></label>
            <label>Raza<input name="raza" maxlength="100"></label>
            <label>Color<input name="color" maxlength="100"></label>
            <label>Sexo
              <select name="sexo">
                <option value="">Seleccionar</option>
                <option>Hembra</option>
                <option>Macho</option>
              </select>
            </label>
            <label>Fecha de nacimiento<input name="fecha_nacimiento" type="date"></label>
            <label class="full">Costo de compra (MXN)
              <input name="costo_compra" type="number" min="0" max="9999999999.99" step="0.01" inputmode="decimal">
            </label>
            <label class="full">Propietario<input name="propietario" maxlength="160"></label>
            <label class="full">Foto (JPG, PNG o WebP, hasta 5 MB)
              <input name="foto" type="file" accept="image/jpeg,image/png,image/webp">
            </label>
            <label class="full">Observaciones
              <textarea name="observaciones" rows="3" maxlength="2000"></textarea>
            </label>
            <button class="full">Guardar animal</button>
          </fieldset>
          <p id="alta-estado" class="status" role="status"></p>
        </form>
      </section>

      <section class="panel" aria-labelledby="titulo-lista">
        <div class="toolbar">
          <h2 id="titulo-lista">Animales registrados</h2>
          <button id="recargar" class="secondary" type="button">Actualizar</button>
        </div>
        <p id="lista-estado" class="status meta" role="status"></p>
        <div id="lista" class="cards"></div>
        <nav aria-label="Páginas del listado">
          <button id="anterior" class="secondary" type="button" disabled>Anterior</button>
          <span id="pagina" class="meta"></span>
          <button id="siguiente" class="secondary" type="button" disabled>Siguiente</button>
        </nav>
      </section>
    </div>
  </section>
</main>

<dialog id="visor" aria-labelledby="foto-titulo">
  <div class="toolbar">
    <h2 id="foto-titulo">Foto del animal</h2>
    <form method="dialog"><button class="secondary">Cerrar foto</button></form>
  </div>
  <p id="foto-estado" class="status" role="status"></p>
  <img id="imagen" alt="Foto del animal" hidden>
</dialog>

<dialog id="editor-animal" aria-labelledby="edicion-titulo">
  <h2 id="edicion-titulo">Editar datos del animal</h2>
  <form id="editar-animal">
    <fieldset id="editar-campos">
      <label>Costo de compra (MXN)
        <input name="costo_compra" type="number" min="0" max="9999999999.99" step="0.01" inputmode="decimal">
      </label>
      <label>Fecha de fallecimiento
        <input name="fecha_fallecimiento" type="date" aria-describedby="fecha-ayuda">
      </label>
      <p id="fecha-ayuda" class="meta">Deja la fecha vacía si el animal está vivo.</p>
      <button>Guardar cambios</button>
    </fieldset>
    <p id="editar-estado" class="status" role="status"></p>
    <button id="cerrar-editor" class="secondary" type="button">Cerrar</button>
  </form>
</dialog>

<noscript>Activa JavaScript para usar Control Ganadero Pro.</noscript>

<script type="module">
const SUPABASE_URL = 'https://zqavbaolozwkkpwhgrhi.supabase.co';
const SUPABASE_KEY = 'sb_publishable_KZzn38tyzYISqu88pYXOlw_jZ7-TvgO';
const BUCKET = 'fotos-ganado';
const PAGE_SIZE = 20;
const PHOTO_TYPES = {'image/jpeg':'jpg','image/png':'png','image/webp':'webp'};
const $ = id => document.getElementById(id);
const dateFormat = new Intl.DateTimeFormat('es-MX', {dateStyle:'medium', timeZone:'UTC'});
const currency = new Intl.NumberFormat('es-MX', {style:'currency', currency:'MXN'});
const percent = new Intl.NumberFormat('es-MX', {style:'percent', maximumFractionDigits:1});

let db, user, editedAnimal;
let saving = false;
let page = 0;
let listRequest = 0;
let photoRequest = 0;

function message(id, value, error = false) {
  $(id).textContent = value;
  $(id).classList.toggle('error', error);
}

function showSession(session) {
  const next = session?.user ?? null;
  if (next?.id === user?.id) return;
  user = next;
  $('editor-animal').close();
  editedAnimal = null;
  $('resumen').hidden = true;
  message('resumen-aviso', '');
  listRequest++;
  closePhoto();
  $('lista').replaceChildren();
  $('alta').reset();
  saving = false;
  $('alta-campos').disabled = true;
  message('alta-estado', '');
  message('aviso', '');
  $('app').hidden = !user;
  $('acceso').hidden = Boolean(user);
  $('salir').hidden = !user;
  $('cuenta').textContent = user?.email ?? '';
  if (user) void loadAnimals(0);
}

function localDate(value) {
  const date = new Date(value);
  return Number.isNaN(date.getTime()) ? value : dateFormat.format(date);
}

function animalCard(animal) {
  const card = document.createElement('article');
  const title = document.createElement('h3');
  title.textContent = animal.nombre ? animal.nombre + ' · ' + animal.arete : 'Arete ' + animal.arete;
  card.append(title);

  const details = [
    ['Raza', animal.raza],
    ['Color', animal.color],
    ['Sexo', animal.sexo],
    ['Nacimiento', animal.fecha_nacimiento && localDate(animal.fecha_nacimiento)],
    ['Costo', animal.costo_compra == null ? 'Sin registrar' : currency.format(animal.costo_compra) + ' MXN'],
    ['Estado', animal.fecha_fallecimiento ? 'Fallecido el ' + localDate(animal.fecha_fallecimiento) : 'Vivo'],
    ['Propietario', animal.propietario],
    ['Registrado', animal.fecha_registro && localDate(animal.fecha_registro)]
  ].filter(([, value]) => value);

  const meta = document.createElement('p');
  meta.className = 'meta';
  meta.textContent = details.map(([label, value]) => label + ': ' + value).join(' · ');
  card.append(meta);

  if (animal.observaciones) {
    const notes = document.createElement('p');
    notes.textContent = animal.observaciones;
    card.append(notes);
  }

  if (animal.foto_url) {
    const button = document.createElement('button');
    button.className = 'secondary';
    button.textContent = 'Ver foto';
    button.addEventListener('click', () => openPhoto(animal));
    card.append(button);
  }

  const edit = document.createElement('button');
  edit.className = 'secondary';
  edit.textContent = 'Editar costo y estado';
  edit.addEventListener('click', () => openAnimalEditor(animal));
  card.append(edit);
  return card;
}

function openAnimalEditor(animal) {
  editedAnimal = animal;
  const form = $('editar-animal');
  form.elements.costo_compra.value = animal.costo_compra ?? '';
  form.elements.fecha_fallecimiento.value = animal.fecha_fallecimiento ?? '';
  $('edicion-titulo').textContent = 'Editar arete ' + animal.arete;
  $('editar-campos').disabled = false;
  message('editar-estado', '');
  $('editor-animal').showModal();
}

$('cerrar-editor').addEventListener('click', () => $('editor-animal').close());

$('editar-animal').addEventListener('submit', async event => {
  event.preventDefault();
  if (!user || !editedAnimal || $('editar-campos').disabled) return;
  const animal = editedAnimal;
  const uid = user.id;
  const fields = new FormData(event.currentTarget);
  $('editar-campos').disabled = true;
  message('editar-estado', 'Guardando cambios…');

  try {
    const {data, error} = await db.from('animales').update({
      costo_compra: fields.get('costo_compra') || null,
      fecha_fallecimiento: fields.get('fecha_fallecimiento') || null
    }).eq('id', animal.id).eq('creado_por', uid).select('id').maybeSingle();

    if (error || !data) throw error ?? new Error('Animal no disponible');
    if (user?.id !== uid) return;
    if (editedAnimal === animal) $('editor-animal').close();
    void loadAnimals(page);
  } catch {
    if (user?.id === uid && editedAnimal === animal) {
      message('editar-estado', 'No se pudieron guardar los cambios. Inténtalo otra vez.', true);
    }
  } finally {
    if (editedAnimal === animal) $('editar-campos').disabled = false;
  }
});

async function loadSummary(request) {
  try {
    const {data, error} = await db.rpc('cg_resumen_animales').single();
    if (error) throw error;
    if (request !== listRequest) return;

    const total = Number(data.total);
    const deaths = Number(data.fallecidos);
    const alive = total - deaths;
    $('ganado-vivo').textContent = alive.toLocaleString('es-MX');
    $('ganado-total').textContent = total.toLocaleString('es-MX') +
      (total === 1 ? ' animal registrado' : ' animales registrados');
    $('barra-ganado').hidden = total === 0;
    $('barra-vivos').style.width = total ? (100 * alive / total) + '%' : '0%';
    $('costo-total').textContent = data.costo_total == null ? 'Sin datos' : currency.format(data.costo_total);
    $('mortalidad').textContent = total ? percent.format(deaths / total) : 'Sin datos';
    $('ganado-fallecido').textContent = deaths.toLocaleString('es-MX') +
      (deaths === 1 ? ' animal fallecido' : ' animales fallecidos');
    $('resumen').hidden = false;
  } catch {
    if (request === listRequest) message('resumen-aviso', 'No se pudo cargar el resumen.', true);
  }
}

async function loadAnimals(target) {
  if (!user) return;
  const request = ++listRequest;
  const uid = user.id;
  $('resumen').hidden = true;
  message('resumen-aviso', '');
  $('anterior').disabled = $('siguiente').disabled = true;
  message('lista-estado', 'Cargando animales…');

  try {
    const membership = await db.rpc('cg_es_socio');
    if (membership.error) throw membership.error;
    if (request !== listRequest) return;

    $('alta-campos').disabled = !membership.data || saving;
    if (!membership.data) {
      $('lista').replaceChildren();
      $('pagina').textContent = '';
      message('lista-estado', 'Tu cuenta todavía no tiene acceso. Pide al administrador que la habilite.', true);
      return;
    }

    const {data, error} = await db.from('animales')
      .select('id,arete,nombre,raza,color,sexo,fecha_nacimiento,propietario,foto_url,observaciones,fecha_registro,costo_compra,fecha_fallecimiento')
      .eq('creado_por', uid)
      .order('fecha_registro', {ascending:false})
      .order('id', {ascending:false})
      .range(target * PAGE_SIZE, (target + 1) * PAGE_SIZE);

    if (error) throw error;
    if (request !== listRequest) return;
    if (!data.length && target > 0) return loadAnimals(target - 1);

    page = target;
    void loadSummary(request);
    $('lista').replaceChildren(...data.slice(0, PAGE_SIZE).map(animalCard));
    $('pagina').textContent = 'Página ' + (page + 1);
    $('anterior').disabled = page === 0;
    $('siguiente').disabled = data.length <= PAGE_SIZE;
    message('lista-estado', data.length ? '' : 'Todavía no tienes animales registrados.');
  } catch {
    if (request === listRequest) {
      message('lista-estado', 'No se pudo cargar el listado. Pulsa Actualizar para reintentar.', true);
    }
  }
}

function closePhoto() {
  photoRequest++;
  if ($('visor').open) $('visor').close();
  $('imagen').hidden = true;
  $('imagen').removeAttribute('src');
}

$('visor').addEventListener('close', () => {
  if (!$('visor').open) closePhoto();
});

async function openPhoto(animal) {
  if (!user) return;
  const request = ++photoRequest;
  const img = $('imagen');
  img.hidden = true;
  img.removeAttribute('src');
  $('foto-titulo').textContent = 'Foto · ' + animal.arete;
  message('foto-estado', 'Cargando foto…');
  $('visor').showModal();

  try {
    if (!animal.foto_url.startsWith(user.id + '/')) throw new Error('Ruta inválida');
    const {data, error} = await db.storage.from(BUCKET).createSignedUrl(animal.foto_url, 120);
    if (error) throw error;
    if (request !== photoRequest || !$('visor').open) return;

    img.onload = () => {
      if (request !== photoRequest) return;
      img.hidden = false;
      message('foto-estado', '');
    };
    img.onerror = () => {
      if (request === photoRequest) {
        message('foto-estado', 'No se pudo mostrar la foto. Cierra y vuelve a abrir.', true);
      }
    };
    img.src = data.signedUrl;
  } catch {
    if (request === photoRequest && $('visor').open) {
      message('foto-estado', 'No se pudo abrir la foto.', true);
    }
  }
}

$('login').addEventListener('submit', async event => {
  event.preventDefault();
  if (!db) return;
  const form = event.currentTarget;
  const fields = new FormData(form);
  $('login-campos').disabled = true;
  message('login-estado', '');

  try {
    const {error} = await db.auth.signInWithPassword({
      email: fields.get('correo').trim(),
      password: fields.get('clave')
    });
    if (error) throw error;
    form.reset();
  } catch {
    message('login-estado', 'No se pudo iniciar sesión. Revisa tus datos y la conexión.', true);
  } finally {
    $('login-campos').disabled = false;
  }
});

$('salir').addEventListener('click', async () => {
  $('salir').disabled = true;
  try {
    const {error} = await db.auth.signOut({scope:'local'});
    if (error) throw error;
  } catch {
    message('aviso', 'No se pudo cerrar la sesión. Vuelve a intentarlo.', true);
  } finally {
    $('salir').disabled = false;
  }
});

$('recargar').addEventListener('click', () => loadAnimals(page));
$('anterior').addEventListener('click', () => loadAnimals(page - 1));
$('siguiente').addEventListener('click', () => loadAnimals(page + 1));

$('alta').addEventListener('submit', async event => {
  event.preventDefault();
  if (!user || saving || $('alta-campos').disabled) return;
  const uid = user.id;
  const form = event.currentTarget;
  const fields = new FormData(form);
  const record = {creado_por:uid, costo_compra:fields.get('costo_compra') || null};

  for (const key of ['arete','nombre','raza','color','sexo','fecha_nacimiento','propietario','observaciones']) {
    record[key] = fields.get(key).trim() || null;
  }
  if (!record.arete) return message('alta-estado', 'Escribe el número de arete.', true);

  const photo = fields.get('foto');
  if (photo.name && (!PHOTO_TYPES[photo.type] || !photo.size || photo.size > 5 * 1024 * 1024)) {
    return message('alta-estado', 'Elige una imagen JPG, PNG o WebP de hasta 5 MB.', true);
  }

  saving = true;
  $('alta-campos').disabled = true;
  message('alta-estado', 'Guardando animal…');
  const bucket = db.storage.from(BUCKET);
  let phase = 'foto';

  try {
    if (photo.name) {
      const path = uid + '/' + crypto.randomUUID() + '.' + PHOTO_TYPES[photo.type];
      const {error} = await bucket.upload(path, photo, {cacheControl:'60', upsert:false});
      if (error) throw error;
      record.foto_url = path;
    }

    if (user?.id !== uid) return;
    phase = 'registro';
    const {error} = await db.from('animales').insert(record);
    if (error) throw error;
    if (user?.id !== uid) return;

    form.reset();
    message('alta-estado', 'Animal registrado.');
    void loadAnimals(0);
  } catch (error) {
    if (user?.id !== uid) return;

    if (phase === 'registro' && /^[0-9A-Z]{5}$/.test(error.code ?? '') && record.foto_url) {
      try {
        await bucket.remove([record.foto_url]);
      } catch {
        // El registro del animal fue rechazado.
      }
    }

    if (user?.id !== uid) return;
    const detail = error.code === '23505' ? 'Ya tienes un animal con ese arete.' :
      phase === 'foto' ? 'No se pudo subir la foto. Revisa tu conexión y los permisos de Storage.' :
      'No se confirmó el registro. Actualiza el listado antes de volver a intentarlo.';
    message('alta-estado', detail, true);
  } finally {
    if (user?.id === uid) {
      saving = false;
      $('alta-campos').disabled = false;
    }
  }
});

async function start() {
  try {
    const {createClient} = await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.2/+esm');
    db = createClient(SUPABASE_URL, SUPABASE_KEY, {auth:{detectSessionInUrl:false}});
    db.auth.onAuthStateChange((_event, session) => setTimeout(() => showSession(session), 0));
    $('login-campos').disabled = false;
  } catch {
    message('aviso', 'No se pudo cargar la conexión con Supabase. Recarga la página.', true);
  }
}

void start();
</script>
</body>
</html>
