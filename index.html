<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Control Ganadero Pro</title>
<style>
:root {
  color-scheme:dark;
  font:100% system-ui,sans-serif;
  color:#f0f7eb;
  background:#101815;
  --panel:#1a2621;
  --borde:#3b4d43;
  --verde:#b8efcc;
  --suave:#b4c9bc;
  --oro:#ffd478;
}
*{box-sizing:border-box}
body{margin:0}
[hidden]{display:none!important}
header{position:sticky;top:0;z-index:1;display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:1rem max(1rem,calc((100vw - 72rem)/2));background:#15221b;border-bottom:1px solid var(--borde)}
header strong{font-size:1.15rem}
main{max-width:74rem;margin:auto;padding:clamp(1rem,3vw,2rem)}
h1,h2,h3,p{margin-top:0}
h1{font-size:clamp(2rem,6vw,3.6rem);letter-spacing:-.045em;margin-bottom:.5rem}
h2{font-size:1.3rem}
.panel,article,dialog{background:var(--panel);border:1px solid var(--borde);border-radius:1rem;padding:clamp(1rem,3vw,1.5rem)}
.login{max-width:29rem;margin:clamp(1rem,7vh,5rem) auto}
.layout{display:grid;grid-template-columns:minmax(18rem,1fr) minmax(0,1.55fr);gap:1rem;align-items:start}
form,fieldset{display:grid;gap:.85rem}
fieldset{padding:0;border:0;margin:0;min-width:0}
fieldset:disabled{opacity:.65}
label{display:grid;gap:.3rem;font-weight:600;font-size:.95rem}
input,select,textarea,button{font:inherit}
input,select,textarea{width:100%;min-width:0;border:1px solid #61776b;border-radius:.5rem;padding:.63rem;color:inherit;background:#121c17}
textarea{resize:vertical}
.fields{grid-template-columns:repeat(2,minmax(0,1fr));gap:.75rem}
.full{grid-column:1/-1}
button,.jump{background:var(--verde);color:#14271b;border:1px solid transparent;border-radius:.65rem;padding:.65rem 1rem;font-weight:700}
button{cursor:pointer}
button:disabled{opacity:.55;cursor:default}
.jump{text-decoration:none}
.secondary{background:#23342b;color:inherit;border-color:#61776b}
:focus-visible{outline:3px solid var(--oro);outline-offset:3px}
.toolbar,.intro{display:flex;justify-content:space-between;align-items:center;gap:.75rem;flex-wrap:wrap}
.toolbar{margin-bottom:.7rem}
.toolbar h2,.intro p{margin:0}
.intro{margin-bottom:1.3rem}
.cards{display:grid;gap:.7rem}
.cards article{padding:1rem;overflow-wrap:anywhere}
.cards h3{margin:0 0 .4rem}
.cards article button{margin:.25rem .35rem .25rem 0}
.meta{color:var(--suave);font-size:.9rem}
.status{margin:0;overflow-wrap:anywhere}
.status:empty{display:none}
.error{color:#ffb1a6}
nav{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap;margin-top:.75rem}
dialog{width:min(92vw,46rem);max-height:90vh;color:inherit}
dialog::backdrop{background:#0d231ecc}
dialog img{display:block;max-width:100%;max-height:67vh;object-fit:contain;margin:auto}
.dashboard{display:grid;grid-template-columns:1.25fr 1fr 1fr 1fr;gap:.8rem;margin-bottom:1rem}
.metric{min-width:0;display:flex;flex-direction:column;gap:.6rem}
.metric h2,.metric p{margin:0}
.metric h2{font-size:.95rem;color:var(--suave)}
.metric strong{font-size:clamp(1.45rem,3.7vw,2.5rem);line-height:1;overflow-wrap:anywhere}
.metric-main{background:linear-gradient(135deg,#254635,#1d3127);border-color:#4b705c}
.metric-main strong{font-size:clamp(3rem,7vw,5rem);color:#e6ffec}
.metric-deaths strong{color:var(--oro)}
.herd-bar{height:.48rem;border-radius:2rem;background:#45584d;overflow:hidden}
.herd-bar span{display:block;width:0;height:100%;background:#9bdfb5}
#resumen-aviso{margin-bottom:1rem}
#registro{scroll-margin-top:6rem}
@media(max-width:760px){
  .layout{grid-template-columns:1fr}
  .dashboard{grid-template-columns:repeat(2,minmax(0,1fr))}
  .metric-main,.metric-sales{grid-column:1/-1}
}
@media(max-width:370px){.fields{grid-template-columns:1fr}}
@media(max-width:350px){.dashboard{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <strong>Control Ganadero Pro</strong>
  <button id="salir" type="button" class="secondary" hidden>Cerrar sesión</button>
</header>

<main>
  <p id="aviso" class="status error" role="alert"></p>

  <section id="acceso" class="panel login">
    <h1>Iniciar sesión</h1>
    <p>Ingresa con tu cuenta de socio.</p>
    <form id="login">
      <fieldset id="login-campos" disabled>
        <label>Correo electrónico
          <input name="correo" type="email" autocomplete="username" required>
        </label>
        <label>Contraseña
          <input name="clave" type="password" autocomplete="current-password" required>
        </label>
        <button>Entrar</button>
      </fieldset>
      <p id="login-estado" class="status" role="alert"></p>
    </form>
  </section>

  <section id="app" hidden>
    <div class="intro">
      <div><h1>Mi ganado</h1><p id="cuenta" class="meta"></p></div>
      <a class="jump" href="#registro">Registrar animal</a>
    </div>

    <p id="resumen-aviso" class="status" role="status"></p>
    <section id="resumen" class="dashboard" aria-label="Resumen del ganado" hidden>
      <article class="metric metric-main">
        <h2>Ganado en pie</h2>
        <strong id="ganado-vivo"></strong>
        <div id="barra-ganado" class="herd-bar" aria-hidden="true"><span id="barra-vivos"></span></div>
        <p id="ganado-total" class="meta"></p>
      </article>
      <article class="metric">
        <h2>Costo de compra</h2>
        <strong id="costo-total"></strong>
        <p class="meta">Total registrado en MXN</p>
      </article>
      <article class="metric metric-sales">
        <h2>Ingresos por ventas</h2>
        <strong id="ingresos-ventas"></strong>
        <p id="ganado-vendido" class="meta"></p>
        <p id="costo-vendidos" class="meta"></p>
      </article>
      <article class="metric metric-deaths">
        <h2>Mortalidad</h2>
        <strong id="mortalidad"></strong>
        <p id="ganado-fallecido" class="meta"></p>
      </article>
    </section>

    <div class="layout">
      <section id="registro" class="panel">
        <h2>Registrar animal</h2>
        <form id="alta">
          <fieldset id="alta-campos" class="fields" disabled>
            <label>Arete<input name="arete" maxlength="80" required></label>
            <label>Nombre<input name="nombre" maxlength="120"></label>
            <label>Raza<input name="raza" maxlength="100"></label>
            <label>Color<input name="color" maxlength="100"></label>
            <label>Sexo
              <select name="sexo">
                <option value="">Seleccionar</option>
                <option>Hembra</option>
                <option>Macho</option>
              </select>
            </label>
            <label>Fecha de nacimiento<input name="fecha_nacimiento" type="date"></label>
            <label class="full">Costo de compra (MXN)
              <input name="costo_compra" type="number" min="0" max="9999999999.99" step="0.01" inputmode="decimal">
            </label>
            <label class="full">Propietario<input name="propietario" maxlength="160"></label>
            <label class="full">Foto (JPG, PNG o WebP, hasta 5 MB)
              <input name="foto" type="file" accept="image/jpeg,image/png,image/webp">
            </label>
            <label class="full">Observaciones
              <textarea name="observaciones" rows="3" maxlength="2000"></textarea>
            </label>
            <button class="full">Guardar animal</button>
          </fieldset>
          <p id="alta-estado" class="status" role="status"></p>
        </form>
      </section>

      <section class="panel" aria-labelledby="titulo-lista">
        <div class="toolbar">
          <h2 id="titulo-lista">Animales registrados</h2>
          <button id="recargar" type="button" class="secondary">Actualizar</button>
        </div>
        <p id="lista-estado" class="status meta" role="status"></p>
        <div id="lista" class="cards"></div>
        <nav aria-label="Páginas del listado">
          <button id="anterior" type="button" class="secondary" disabled>Anterior</button>
          <span id="pagina" class="meta"></span>
          <button id="siguiente" type="button" class="secondary" disabled>Siguiente</button>
        </nav>
      </section>
    </div>
  </section>
</main>

<dialog id="visor" aria-labelledby="foto-titulo">
  <div class="toolbar">
    <h2 id="foto-titulo">Foto del animal</h2>
    <form method="dialog"><button class="secondary">Cerrar foto</button></form>
  </div>
  <p id="foto-estado" class="status" role="status"></p>
  <img id="imagen" alt="Foto del animal" hidden>
</dialog>

<dialog id="editor" aria-labelledby="edicion-titulo">
  <h2 id="edicion-titulo">Editar animal</h2>
  <form id="edicion">
    <fieldset id="editar-campos">
      <label>Costo de compra (MXN)
        <input name="costo_compra" type="number" min="0" max="9999999999.99" step="0.01" inputmode="decimal">
      </label>
      <label>Fecha de venta<input name="fecha_venta" type="date"></label>
      <label>Precio de venta (MXN)
        <input name="precio_venta" type="number" min="0" max="9999999999.99" step="0.01" inputmode="decimal">
      </label>
      <label>Fecha de fallecimiento<input name="fecha_fallecimiento" type="date"></label>
      <button>Guardar cambios</button>
    </fieldset>
    <p id="editar-estado" class="status" role="status"></p>
    <button id="cerrar-editor" type="button" class="secondary">Cerrar</button>
  </form>
</dialog>

<noscript>Activa JavaScript para usar Control Ganadero Pro.</noscript>

<script type="module">
const SUPABASE_URL = 'https://zqavbaolozwkkpwhgrhi.supabase.co';
const SUPABASE_KEY = 'sb_publishable_KZzn38tyzYISqu88pYXOlw_jZ7-TvgO';
const BUCKET = 'fotos-ganado';
const PAGE_SIZE = 20;
const PHOTO_TYPES = {'image/jpeg':'jpg','image/png':'png','image/webp':'webp'};
const $ = id => document.getElementById(id);
const pesos = new Intl.NumberFormat('es-MX', {style:'currency', currency:'MXN'});
const porcentaje = new Intl.NumberFormat('es-MX', {style:'percent', maximumFractionDigits:1});
const fecha = new Intl.DateTimeFormat('es-MX', {dateStyle:'medium', timeZone:'UTC'});
const camposEdicion = ['costo_compra','fecha_venta','precio_venta','fecha_fallecimiento'];

let db, user, animalEditado;
let pagina = 0;
let versionLista = 0;
let versionFoto = 0;
let guardando = false;

function mensaje(id, texto, error = false) {
  $(id).textContent = texto;
  $(id).classList.toggle('error', error);
}

function mostrarSesion(session) {
  const siguiente = session?.user ?? null;
  if (siguiente?.id === user?.id) return;
  user = siguiente;
  versionLista++;
  cerrarFoto();
  $('editor').close();
  animalEditado = null;
  $('resumen').hidden = true;
  $('lista').replaceChildren();
  $('alta').reset();
  $('alta-campos').disabled = true;
  guardando = false;
  mensaje('aviso', '');
  mensaje('resumen-aviso', '');
  mensaje('alta-estado', '');
  $('app').hidden = !user;
  $('acceso').hidden = Boolean(user);
  $('salir').hidden = !user;
  $('cuenta').textContent = user?.email ?? '';
  if (user) void cargarAnimales(0);
}

function cambiarFicha(animal) {
  animalEditado = animal;
  const form = $('edicion');
  for (const campo of camposEdicion) {
    form.elements.namedItem(campo).value = animal[campo] ?? '';
  }
  $('edicion-titulo').textContent = 'Editar arete ' + animal.arete;
  $('editar-campos').disabled = false;
  mensaje('editar-estado', '');
  $('editor').showModal();
}

function ficha(animal) {
  const card = document.createElement('article');
  const titulo = document.createElement('h3');
  titulo.textContent = animal.nombre ? animal.nombre + ' · ' + animal.arete : 'Arete ' + animal.arete;
  card.append(titulo);

  let estado = 'En el hato';
  if (animal.fecha_venta) estado = 'Vendido el ' + fecha.format(new Date(animal.fecha_venta));
  if (animal.fecha_fallecimiento) estado = 'Fallecido el ' + fecha.format(new Date(animal.fecha_fallecimiento));

  const datos = [
    ['Raza', animal.raza],
    ['Color', animal.color],
    ['Sexo', animal.sexo],
    ['Nacimiento', animal.fecha_nacimiento && fecha.format(new Date(animal.fecha_nacimiento))],
    ['Propietario', animal.propietario],
    ['Registrado', animal.fecha_registro && fecha.format(new Date(animal.fecha_registro))],
    ['Costo', animal.costo_compra == null ? 'Sin registrar' : pesos.format(animal.costo_compra)],
    ['Estado', estado],
    ['Venta', animal.fecha_venta && pesos.format(animal.precio_venta)]
  ].filter(([, valor]) => valor);
  const detalle = document.createElement('p');
  detalle.className = 'meta';
  detalle.textContent = datos.map(([etiqueta, valor]) => etiqueta + ': ' + valor).join(' · ');
  card.append(detalle);

  if (animal.observaciones) {
    const nota = document.createElement('p');
    nota.textContent = animal.observaciones;
    card.append(nota);
  }

  if (animal.foto_url) {
    const foto = document.createElement('button');
    foto.className = 'secondary';
    foto.textContent = 'Ver foto';
    foto.addEventListener('click', () => abrirFoto(animal));
    card.append(foto);
  }

  const editar = document.createElement('button');
  editar.className = 'secondary';
  editar.textContent = 'Editar costo, venta y estado';
  editar.addEventListener('click', () => cambiarFicha(animal));
  card.append(editar);
  return card;
}

async function cargarResumen(version) {
  try {
    const {data, error} = await db.rpc('cg_resumen_con_ventas').single();
    if (error) throw error;
    if (version !== versionLista) return;

    const total = Number(data.total);
    const fallecidos = Number(data.fallecidos);
    const vendidos = Number(data.vendidos);
    const vivos = total - fallecidos - vendidos;

    $('ganado-vivo').textContent = vivos.toLocaleString('es-MX');
    $('ganado-total').textContent = total.toLocaleString('es-MX') +
      (total === 1 ? ' animal registrado' : ' animales registrados');
    $('barra-ganado').hidden = total === 0;
    $('barra-vivos').style.width = total ? (100 * vivos / total) + '%' : '0%';
    $('costo-total').textContent = data.costo_total == null ? 'Sin datos' : pesos.format(data.costo_total);
    $('ingresos-ventas').textContent = pesos.format(data.ingresos_ventas ?? 0);
    $('ganado-vendido').textContent = vendidos.toLocaleString('es-MX') +
      (vendidos === 1 ? ' animal vendido' : ' animales vendidos');
    $('costo-vendidos').textContent = data.costo_vendidos == null ? 'Costo de vendidos: sin datos' :
      'Costo registrado de vendidos: ' + pesos.format(data.costo_vendidos);
    $('mortalidad').textContent = total ? porcentaje.format(fallecidos / total) : 'Sin datos';
    $('ganado-fallecido').textContent = fallecidos.toLocaleString('es-MX') +
      (fallecidos === 1 ? ' animal fallecido' : ' animales fallecidos');
    $('resumen').hidden = false;
  } catch {
    if (version === versionLista) mensaje('resumen-aviso', 'No se pudo cargar el resumen.', true);
  }
}

async function cargarAnimales(destino) {
  if (!user) return;
  const version = ++versionLista;
  const uid = user.id;
  $('resumen').hidden = true;
  $('anterior').disabled = $('siguiente').disabled = true;
  mensaje('resumen-aviso', '');
  mensaje('lista-estado', 'Cargando animales…');

  try {
    const socio = await db.rpc('cg_es_socio');
    if (socio.error) throw socio.error;
    if (version !== versionLista) return;
    $('alta-campos').disabled = !socio.data || guardando;
    if (!socio.data) {
      $('lista').replaceChildren();
      $('pagina').textContent = '';
      mensaje('lista-estado', 'Tu cuenta todavía no tiene acceso.', true);
      return;
    }

    const {data, error} = await db.from('animales')
      .select('id,arete,nombre,raza,color,sexo,fecha_nacimiento,propietario,foto_url,observaciones,fecha_registro,costo_compra,fecha_fallecimiento,fecha_venta,precio_venta')
      .eq('creado_por', uid)
      .order('fecha_registro', {ascending:false})
      .order('id', {ascending:false})
      .range(destino * PAGE_SIZE, (destino + 1) * PAGE_SIZE);

    if (error) throw error;
    if (version !== versionLista) return;
    if (!data.length && destino > 0) return cargarAnimales(destino - 1);

    pagina = destino;
    $('lista').replaceChildren(...data.slice(0, PAGE_SIZE).map(ficha));
    $('pagina').textContent = 'Página ' + (pagina + 1);
    $('anterior').disabled = pagina === 0;
    $('siguiente').disabled = data.length <= PAGE_SIZE;
    mensaje('lista-estado', data.length ? '' : 'Todavía no tienes animales registrados.');
    void cargarResumen(version);
  } catch {
    if (version === versionLista) {
      mensaje('lista-estado', 'No se pudo cargar el listado. Pulsa Actualizar para reintentar.', true);
    }
  }
}

function cerrarFoto() {
  versionFoto++;
  if ($('visor').open) $('visor').close();
  $('imagen').hidden = true;
  $('imagen').removeAttribute('src');
}

$('visor').addEventListener('close', () => {
  if (!$('visor').open) cerrarFoto();
});

async function abrirFoto(animal) {
  if (!user) return;
  const version = ++versionFoto;
  const imagen = $('imagen');
  imagen.hidden = true;
  imagen.removeAttribute('src');
  $('foto-titulo').textContent = 'Foto · ' + animal.arete;
  mensaje('foto-estado', 'Cargando foto…');
  $('visor').showModal();

  try {
    if (!animal.foto_url.startsWith(user.id + '/')) throw new Error('Ruta inválida');
    const {data, error} = await db.storage.from(BUCKET).createSignedUrl(animal.foto_url, 120);
    if (error) throw error;
    if (version !== versionFoto || !$('visor').open) return;

    imagen.onload = () => {
      if (version !== versionFoto) return;
      imagen.hidden = false;
      mensaje('foto-estado', '');
    };
    imagen.onerror = () => {
      if (version === versionFoto) mensaje('foto-estado', 'No se pudo mostrar la foto.', true);
    };
    imagen.src = data.signedUrl;
  } catch {
    if (version === versionFoto && $('visor').open) {
      mensaje('foto-estado', 'No se pudo abrir la foto.', true);
    }
  }
}

$('login').addEventListener('submit', async event => {
  event.preventDefault();
  if (!db) return;
  const form = event.currentTarget;
  const campos = new FormData(form);
  $('login-campos').disabled = true;
  mensaje('login-estado', '');

  try {
    const {error} = await db.auth.signInWithPassword({
      email: campos.get('correo').trim(),
      password: campos.get('clave')
    });
    if (error) throw error;
    form.reset();
  } catch {
    mensaje('login-estado', 'No se pudo iniciar sesión. Revisa tus datos y la conexión.', true);
  } finally {
    $('login-campos').disabled = false;
  }
});

$('salir').addEventListener('click', async () => {
  $('salir').disabled = true;
  try {
    const {error} = await db.auth.signOut({scope:'local'});
    if (error) throw error;
  } catch {
    mensaje('aviso', 'No se pudo cerrar la sesión. Vuelve a intentarlo.', true);
  } finally {
    $('salir').disabled = false;
  }
});

$('recargar').addEventListener('click', () => cargarAnimales(pagina));
$('anterior').addEventListener('click', () => cargarAnimales(pagina - 1));
$('siguiente').addEventListener('click', () => cargarAnimales(pagina + 1));
$('cerrar-editor').addEventListener('click', () => $('editor').close());

$('edicion').addEventListener('submit', async event => {
  event.preventDefault();
  if (!user || !animalEditado || $('editar-campos').disabled) return;

  const animal = animalEditado;
  const uid = user.id;
  const campos = new FormData(event.currentTarget);
  const cambios = Object.fromEntries(camposEdicion.map(campo => [campo, campos.get(campo) || null]));

  if (Boolean(cambios.fecha_venta) !== Boolean(cambios.precio_venta)) {
    return mensaje('editar-estado', 'Completa la fecha y el precio de venta.', true);
  }
  if (cambios.fecha_venta && cambios.fecha_fallecimiento) {
    return mensaje('editar-estado', 'Para guardar la venta, deja vacía la fecha de fallecimiento.', true);
  }

  $('editar-campos').disabled = true;
  mensaje('editar-estado', 'Guardando cambios…');

  try {
    const {data, error} = await db.from('animales').update(cambios)
      .eq('id', animal.id).eq('creado_por', uid).select('id').maybeSingle();
    if (error || !data) throw error ?? new Error('Animal no disponible');
    if (user?.id !== uid) return;
    if (animalEditado === animal) $('editor').close();
    void cargarAnimales(pagina);
  } catch {
    if (user?.id === uid && animalEditado === animal) {
      mensaje('editar-estado', 'No se pudieron guardar los cambios. Inténtalo otra vez.', true);
    }
  } finally {
    if (animalEditado === animal) $('editar-campos').disabled = false;
  }
});

$('alta').addEventListener('submit', async event => {
  event.preventDefault();
  if (!user || guardando || $('alta-campos').disabled) return;

  const uid = user.id;
  const form = event.currentTarget;
  const campos = new FormData(form);
  const registro = {creado_por:uid, costo_compra:campos.get('costo_compra') || null};
  for (const campo of ['arete','nombre','raza','color','sexo','fecha_nacimiento','propietario','observaciones']) {
    registro[campo] = campos.get(campo).trim() || null;
  }
  if (!registro.arete) return mensaje('alta-estado', 'Escribe el número de arete.', true);

  const foto = campos.get('foto');
  if (foto.name && (!PHOTO_TYPES[foto.type] || !foto.size || foto.size > 5 * 1024 * 1024)) {
    return mensaje('alta-estado', 'Elige una imagen JPG, PNG o WebP de hasta 5 MB.', true);
  }

  guardando = true;
  $('alta-campos').disabled = true;
  mensaje('alta-estado', 'Guardando animal…');
  const bucket = db.storage.from(BUCKET);
  let fase = 'foto';

  try {
    if (foto.name) {
      const ruta = uid + '/' + crypto.randomUUID() + '.' + PHOTO_TYPES[foto.type];
      const {error} = await bucket.upload(ruta, foto, {cacheControl:'60', upsert:false});
      if (error) throw error;
      registro.foto_url = ruta;
    }

    if (user?.id !== uid) return;
    fase = 'registro';
    const {error} = await db.from('animales').insert(registro);
    if (error) throw error;
    if (user?.id !== uid) return;

    form.reset();
    mensaje('alta-estado', 'Animal registrado.');
    void cargarAnimales(0);
  } catch (error) {
    if (user?.id !== uid) return;

    if (fase === 'registro' && /^[0-9A-Z]{5}$/.test(error.code ?? '') && registro.foto_url) {
      try {
        await bucket.remove([registro.foto_url]);
      } catch {
        // La foto queda disponible para revisión en Storage.
      }
    }

    if (user?.id !== uid) return;
    let detalle = 'No se confirmó el registro. Actualiza el listado antes de volver a intentarlo.';
    if (fase === 'foto') detalle = 'No se pudo subir la foto. Revisa la conexión y los permisos de Storage.';
    if (error.code === '23505') detalle = 'Ya tienes un animal con ese arete.';
    mensaje('alta-estado', detalle, true);
  } finally {
    if (user?.id === uid) {
      guardando = false;
      $('alta-campos').disabled = false;
    }
  }
});

async function iniciar() {
  try {
    const {createClient} = await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.2/+esm');
    db = createClient(SUPABASE_URL, SUPABASE_KEY, {auth:{detectSessionInUrl:false}});
    db.auth.onAuthStateChange((_evento, session) => {
      setTimeout(() => mostrarSesion(session), 0);
    });
    $('login-campos').disabled = false;
  } catch {
    mensaje('aviso', 'No se pudo cargar la conexión con Supabase. Recarga la página.', true);
  }
}

void iniciar();
</script>
